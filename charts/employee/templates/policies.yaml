{{- if not .Values.id }}{{ fail "id is required" }}{{ end }}
# Default deny: nothing in or out unless an agent explicitly allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {port: 53, protocol: UDP}
    - {port: 53, protocol: TCP}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: employee-quota
spec:
  hard:
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory }}
    limits.memory: {{ .Values.quota.limitsMemory }}
    persistentvolumeclaims: {{ .Values.quota.persistentVolumeClaims | quote }}
    requests.storage: {{ .Values.quota.storage }}
    services.loadbalancers: "0"
    services.nodeports: "0"
