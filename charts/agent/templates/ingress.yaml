{{- include "agent.validate" . }}
{{- if .Values.ingress.enabled }}
# Public UI: https://<employee>-<name>.<domain> on the platform Gateway. Entra ID
# sign-in is enforced by the Gateway's SecurityPolicy; the OpenClaw token is
# still required by the UI itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}-ui
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  parentRefs:
  - {name: {{ .Values.ingress.gateway.name }}, namespace: {{ .Values.ingress.gateway.namespace }}, sectionName: https}
  hostnames: [{{ include "agent.publicHost" . | quote }}]
  rules:
  - backendRefs:
    - {name: {{ .Values.name }}-brain, port: {{ .Values.brain.openclaw.port }}}
{{- if .Values.channels.msteams.enabled }}
---
# Teams webhook. Separate route so its own SecurityPolicy replaces the
# Gateway-wide Entra login (a bot cannot sign in): the Gateway only lets
# through requests with a Bot Framework JWT for this bot (aud = appId).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}-msteams
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  parentRefs:
  - {name: {{ .Values.ingress.gateway.name }}, namespace: {{ .Values.ingress.gateway.namespace }}, sectionName: https}
  hostnames: [{{ include "agent.publicHost" . | quote }}]
  rules:
  - matches:
    - path: {type: Exact, value: /api/messages}
      method: POST
    backendRefs:
    - {name: {{ .Values.name }}-brain, port: {{ .Values.brain.openclaw.port }}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Values.name }}-msteams-jwt
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: {{ .Values.name }}-msteams}
  jwt:
    providers:
    - name: botframework
      issuer: https://api.botframework.com
      audiences: [{{ .Values.channels.msteams.appId | quote }}]
      remoteJWKS:
        uri: https://login.botframework.com/v1/.well-known/keys
{{- end }}
---
# Brain UI reachable only from the public Gateway's Envoy pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-brain-ingress
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
      agentplatform.io/role: brain
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Values.ingress.proxyNamespace }}}
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: {{ .Values.ingress.gateway.name }}
          gateway.envoyproxy.io/owning-gateway-namespace: {{ .Values.ingress.gateway.namespace }}
    ports:
    - {port: {{ .Values.brain.openclaw.port }}, protocol: TCP}
{{- end }}
