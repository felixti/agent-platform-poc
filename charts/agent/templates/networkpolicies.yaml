{{- include "agent.validate" . }}
# On top of the employee namespace's default-deny + DNS:
#  brain    -> its own computer (ssh, cdp), the platform LLM gateway and, with a
#              channel enabled, its egress proxy brain listener (channel API only)
#  computer <- its own brain only (ssh, and CDP when the browser is enabled)
#  computer -> its own egress proxy only (when egress.allow is set); else DNS only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-brain-egress
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
      agentplatform.io/role: brain
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "agent.labels" . | nindent 10 }}
          agentplatform.io/role: computer
    ports:
    - {port: 2222, protocol: TCP}
    {{- if .Values.computer.browser.enabled }}
    - {port: {{ .Values.computer.browser.port }}, protocol: TCP}
    {{- end }}
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Values.llm.gatewayNamespace }}}
      podSelector:
        matchLabels: {gateway.envoyproxy.io/owning-gateway-name: {{ .Values.llm.gatewayName }}}
    ports:
    - {port: 10080, protocol: TCP}   # Envoy container port for listener :80
  {{- if include "agent.brainEgressAllow" . | fromJsonArray }}
  - to:
    - podSelector:
        matchLabels:
          {{- include "agent.labels" . | nindent 10 }}
          agentplatform.io/role: egress
    ports:
    - {port: {{ .Values.egress.brainPort }}, protocol: TCP}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-computer-ingress
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
      agentplatform.io/role: computer
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "agent.labels" . | nindent 10 }}
          agentplatform.io/role: brain
    ports:
    - {port: 2222, protocol: TCP}
    {{- if .Values.computer.browser.enabled }}
    - {port: {{ .Values.computer.browser.port }}, protocol: TCP}
    {{- end }}
{{- if .Values.egress.allow }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-computer-egress
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
      agentplatform.io/role: computer
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "agent.labels" . | nindent 10 }}
          agentplatform.io/role: egress
    ports:
    - {port: {{ .Values.egress.port }}, protocol: TCP}
{{- end }}
