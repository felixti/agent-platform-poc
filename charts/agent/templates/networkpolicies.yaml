{{- include "agent.validate" . }}
# On top of the employee namespace's default-deny + DNS:
#  brain    -> its own computer (ssh) and the platform LLM gateway, nothing else
#  computer <- its own brain only; no egress besides DNS (no internet in the PoC)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-brain-egress
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
      agentplatform.io/role: brain
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "agent.labels" . | nindent 10 }}
          agentplatform.io/role: computer
    ports:
    - {port: 2222, protocol: TCP}
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Values.llm.gatewayNamespace }}}
      podSelector:
        matchLabels: {gateway.envoyproxy.io/owning-gateway-name: {{ .Values.llm.gatewayName }}}
    ports:
    - {port: 10080, protocol: TCP}   # Envoy container port for listener :80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-computer-ingress
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
      agentplatform.io/role: computer
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "agent.labels" . | nindent 10 }}
          agentplatform.io/role: brain
    ports:
    - {port: 2222, protocol: TCP}
