{{- include "agent.validate" . }}
{{- if eq .Values.brainKind "openclaw" }}
{{- $port := int .Values.brain.openclaw.port }}
{{- $model := dict "id" .Values.model "name" .Values.model "reasoning" false "input" (list "text") "contextWindow" (int .Values.llm.contextWindow) "maxTokens" (int .Values.llm.maxTokens) }}
{{- $provider := dict "baseUrl" .Values.llm.baseUrl "apiKey" "injected-by-platform-gateway" "api" "openai-completions" "models" (list $model) }}
{{- $envRef := dict "source" "env" "provider" "default" }}
{{- $ssh := dict
      "target" (printf "agent@%s:2222" (include "agent.computerHost" .))
      "workspaceRoot" "/workspace/sandboxes"
      "strictHostKeyChecking" true
      "updateHostKeys" false
      "identityData" (merge (dict "id" "SSH_IDENTITY") $envRef)
      "knownHostsData" (merge (dict "id" "SSH_KNOWN_HOSTS") $envRef) }}
{{- $sandbox := dict "mode" "all" "backend" "ssh" "scope" "agent" "workspaceAccess" "rw" "ssh" $ssh }}
{{- $config := dict
      "gateway" (dict "mode" "local" "controlUi" (dict "allowedOrigins" (list (printf "http://localhost:%d" $port) (printf "http://127.0.0.1:%d" $port))))
      "models" (dict "providers" (dict .Values.llm.providerName $provider))
      "agents" (dict "defaults" (dict
          "model" (dict "primary" (printf "%s/%s" .Values.llm.providerName .Values.model))
          "sandbox" $sandbox)) }}
{{- if .Values.computer.browser.enabled }}
{{- /* The browser runs in the computer (Kata VM); the brain attaches over CDP.
       OpenClaw's own sandbox browser is Docker-only, so allow "host" control:
       the remote attach-only profile is the only browser the brain has. */}}
{{- $_ := set $sandbox "browser" (dict "allowHostControl" true) }}
{{- $profile := dict "cdpUrl" (printf "http://%s:%d" (include "agent.computerHost" .) (int .Values.computer.browser.port)) "attachOnly" true }}
{{- /* Strict SSRF policy stays on. Exceptions: the computer's CDP host and the
       agent's egress allowlist (strict mode only navigates to listed names;
       the egress proxy enforces the same list at the network layer). */}}
{{- $ssrf := dict "dangerouslyAllowPrivateNetwork" false "allowedHostnames" (concat (list (include "agent.computerHost" .)) .Values.egress.allow) }}
{{- $_ := set $config "browser" (dict "enabled" true "defaultProfile" "computer" "profiles" (dict "computer" $profile) "ssrfPolicy" $ssrf) }}
{{- end }}
{{- /* Platform-owned keys, re-applied with `openclaw config set` on every start
       (the seeded file is the brain's own after first boot). */}}
{{- $platformSet := list }}
{{- if .Values.computer.browser.enabled }}
{{- $platformSet = append $platformSet (dict "path" "browser" "value" $config.browser) }}
{{- $platformSet = append $platformSet (dict "path" "agents.defaults.sandbox.browser" "value" $sandbox.browser) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-brain-config
  labels: {{- include "agent.labels" . | nindent 4 }}
data:
  openclaw.json: {{ toPrettyJson $config | quote }}
  platform-set.json: {{ toJson $platformSet | quote }}
---
# Pre-provisioned handle to the platform's golden snapshot, bound into this
# employee namespace (VolumeSnapshots are namespaced; the content is not).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotContent
metadata:
  name: {{ .Values.employee }}-{{ .Values.name }}-brain-golden
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  deletionPolicy: Retain
  driver: disk.csi.azure.com
  volumeSnapshotClassName: agent-disk-snapshot
  source:
    snapshotHandle: {{ required "brain.stateSnapshotHandle is required" .Values.brain.stateSnapshotHandle }}
  volumeSnapshotRef:
    name: {{ .Values.name }}-brain-golden
    namespace: {{ .Release.Namespace }}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: {{ .Values.name }}-brain-golden
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  volumeSnapshotClassName: agent-disk-snapshot
  source:
    volumeSnapshotContentName: {{ .Values.employee }}-{{ .Values.name }}-brain-golden
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}-brain
  labels: {{- include "agent.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-brain
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "agent.labels" . | nindent 4 }}
    agentplatform.io/role: brain
  ports:
  - {name: http, port: {{ $port }}, targetPort: {{ $port }}}
---
# The brain: trusted agent loop (OpenClaw gateway). Runs with runc on the
# platform pool, holds its own state on a PVC, no provider credentials.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}-brain
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}-brain
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
      agentplatform.io/role: brain
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
        agentplatform.io/role: brain
      annotations:
        checksum/config: {{ toJson $config | sha256sum }}
        checksum/platform-set: {{ toJson $platformSet | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.name }}-brain
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        agentplatform.io/pool: platform
      # No fsGroup: the kubelet would re-add group write to the state disk,
      # which OpenClaw's state-dir safety checks reject. Ownership comes from
      # the golden snapshot instead (uid 1000, 0700).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      # The gateway rewrites its config at runtime: start from a fresh copy
      # of the GitOps-managed config on every start.
      # Per the upstream OpenClaw Kubernetes recipe:
      #  - seed openclaw.json only when missing: after first boot the PVC copy is
      #    the source of truth (OpenClaw treats external overwrites as clobbering
      #    and restores its backup ring). Reseed: delete the file and restart.
      #  - prepare a sticky (1777) temp dir owned by the same UID for /tmp.
      #  - re-apply platform-owned keys (browser profile + SSRF allowlist) with
      #    `openclaw config set`, the supported writer, so allowlist edits in git
      #    reach existing agents without a reseed.
      - name: init-config
        image: {{ .Values.brain.openclaw.image }}
        command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p -m 0700 /data/gateway
          if [ ! -f /data/gateway/openclaw.json ]; then
            cp /config/openclaw.json /data/gateway/openclaw.json
            chmod 0600 /data/gateway/openclaw.json
            echo "seeded openclaw.json"
          fi
          mkdir -p /scratch/gateway-tmp && chmod 1777 /scratch/gateway-tmp
          if [ "$(cat /config/platform-set.json)" != "[]" ]; then
            HOME=/data OPENCLAW_CONFIG_PATH=/data/gateway/openclaw.json \
              node openclaw.mjs config set --batch-file /config/platform-set.json
          fi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 768Mi}
        volumeMounts:
        - {name: config, mountPath: /config}
        - {name: state, mountPath: /data}
        - {name: tmp, mountPath: /scratch}
      containers:
      - name: brain
        image: {{ .Values.brain.openclaw.image }}
        args: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "{{ $port }}"]
        ports:
        - {name: http, containerPort: {{ $port }}}
        env:
        # State lives under $HOME/.openclaw on the PVC (cloned from the golden
        # snapshot, root dir owned by uid 1000 with mode 0700).
        - {name: HOME, value: /data}
        - {name: OPENCLAW_NO_RESPAWN, value: "1"}
        - {name: NODE_COMPILE_CACHE, value: /tmp/openclaw-compile-cache}
        # Config lives on the brain's own disk (seeded once, see init-config).
        - {name: OPENCLAW_CONFIG_PATH, value: /data/gateway/openclaw.json}
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom: {secretKeyRef: {name: {{ .Values.name }}-gateway-token, key: password}}
        - name: SSH_IDENTITY
          valueFrom: {secretKeyRef: {name: {{ .Values.name }}-ssh-client, key: privateKey}}
        - name: SSH_KNOWN_HOSTS
          valueFrom: {secretKeyRef: {name: {{ .Values.name }}-ssh-host, key: known_hosts}}
        resources: {{- toYaml .Values.brain.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        readinessProbe:
          tcpSocket: {port: {{ $port }}}
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - {name: state, mountPath: /data}
        - {name: tmp, mountPath: /tmp, subPath: gateway-tmp}
      volumes:
      - name: config
        configMap: {name: {{ .Values.name }}-brain-config}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: state
    spec:
      dataSource:
        apiGroup: snapshot.storage.k8s.io
        kind: VolumeSnapshot
        name: {{ .Values.name }}-brain-golden
      accessModes: [ReadWriteOnce]
      storageClassName: {{ .Values.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.brain.storage }}
{{- end }}
