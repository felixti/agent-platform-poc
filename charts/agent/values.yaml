# Set per agent by agents/<employee>/<name>.yaml (ApplicationSet).
employee: ""
name: ""
brainKind: openclaw          # openclaw | hermes (P5) | pi-durable (phase 2)
model: ""                    # provider model id, e.g. meta/muse-spark-1.3-contributor

llm:
  # OpenAI-compatible endpoint. The platform gateway injects credentials,
  # so brains never hold a provider key.
  providerName: llmgw
  baseUrl: http://llm-gateway.envoy-gateway-system.svc/api/v1
  gatewayNamespace: envoy-gateway-system
  gatewayName: llm-gateway
  contextWindow: 262144
  maxTokens: 8192

brain:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.11.1@sha256:db0e0809fbd0df375445e9eea8daf2a278ac7ac3a263fa6bfce8fb344ad3ad77
    port: 18789
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {memory: 3Gi}
  storage: 2Gi
  # Golden empty disk (root owned by uid 1000, mode 0700) from
  # gitops/platform/brain-disk-template. Brain state PVCs are cloned from it so
  # off-the-shelf brains (SQLite state) never need root to fix ownership.
  stateSnapshotHandle: /subscriptions/9cee39bb-0212-4483-855e-7cdb5f6d3155/resourceGroups/MC_aks-lab_aks-lab_eastus/providers/Microsoft.Compute/snapshots/snapshot-0ec8899f-01b4-4d18-82af-6a3d57e73ee1

computer:
  image: ghcr.io/felixti/agent-sandbox-ssh:43953751078456e9f2e20cad3e80e835b9620963@sha256:b0f466acfe5e140e6e967f4b7f7f289b7a70f7a47388a79fb2b4534a93c8fae3
  runtimeClassName: kata-vm-isolation
  # The Kata pod VM is sized from the limits (headless Chromium needs ~1-2 GiB).
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: 1500m, memory: 3Gi}
  storage: 4Gi
  operatingMode: Running     # Running | Suspended (hibernate, keeps the PVC)
  # Headless Chromium in the computer, driven by the brain's browser tool over
  # CDP (:9222, brain-only). Reaches the internet through the egress proxy.
  browser:
    enabled: true
    port: 9222

# Internet access for the computer. Empty allow = no internet (default).
# Entries are hostnames, "*.example.com" wildcards allowed; ports 80/443 only.
egress:
  allow: []
  port: 3128
  brainPort: 3129            # brain listener; hosts derived from enabled channels
  image: docker.io/envoyproxy/envoy:distroless-v1.40.2@sha256:09ca6f2140a61ad8df11779a4a30d52b48433d444466328494f9188c9c35eded
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}

storageClassName: agent-disk

# Messaging channels. Tokens live in the agent-channels Key Vault as
# "<employee>-<name>-<channel>" and reach only this agent's brain (ESO).
# The brain talks to the channel API through its egress proxy listener.
channels:
  secretStore: agent-channels
  telegram:
    enabled: false
    dmPolicy: pairing        # pairing | allowlist | open | disabled
