# One file per agent. Merge a PR here = agent provisioned.
employee: alice
name: assistant
brainKind: openclaw
model: meta/muse-spark-1.3-contributor
# Internet for the agent's computer (via its egress proxy). Omit = no internet.
# Hostnames or "*.domain" wildcards; HTTPS (443) and HTTP (80) only.
egress:
  allow:
  - github.com
  - "*.github.com"
  - "*.githubusercontent.com"
  - pypi.org
  - files.pythonhosted.org
  - registry.npmjs.org
  - example.com
  - en.wikipedia.org
  # YouTube (pages, API, player, images, video, fonts); no ads, no Google login
  - youtube.com
  - "*.youtube.com"
  - youtu.be
  - "*.youtube-nocookie.com"
  - youtubei.googleapis.com
  - jnn-pa.googleapis.com
  - "*.ytimg.com"
  - "*.ggpht.com"
  - yt3.googleusercontent.com
  - "*.googlevideo.com"
  - "*.gstatic.com"
  - fonts.googleapis.com
# Messaging channels. Token: Key Vault kv-agentch-* secret "alice-assistant-telegram".
channels:
  telegram:
    enabled: true
