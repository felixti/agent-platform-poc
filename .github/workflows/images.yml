name: images
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [sandbox-ssh]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/agent-${{ matrix.image }}:latest
