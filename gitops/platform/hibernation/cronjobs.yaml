# Schedule-based hibernation (D56/D62/D63): every 10 min, put agent computers
# (Kata VMs) in the state the clock says: Running Mon-Fri 08:00-20:00 Sao Paulo,
# Suspended otherwise. Reconcile, not edge-triggered, so a stopped cluster
# converges on start. Brains are never touched (channels keep answering).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: computers-schedule
spec:
  schedule: "*/10 * * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: hibernator
          restartPolicy: Never
          nodeSelector: {agentplatform.io/pool: platform}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
          - name: hibernate
            image: docker.io/library/python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
            command: [python3, -I, /script/hibernate.py]
            env: [{name: AWAKE_FROM, value: "8"}, {name: AWAKE_TO, value: "20"}]
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 64Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            volumeMounts: [{name: script, mountPath: /script, readOnly: true}]
          volumes: [{name: script, configMap: {name: hibernate-script}}]
