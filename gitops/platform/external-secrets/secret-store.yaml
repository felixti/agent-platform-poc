# Identity used to read the platform Key Vault (Workload Identity, read-only:
# "Key Vault Secrets User"). Client ID comes from `tofu output eso_client_id`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-kv-reader
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: 28b38d55-5172-4eb3-a386-fd2505903cdd
    azure.workload.identity/tenant-id: 5f9bf155-4fca-4d0c-8201-ca5e6100f66e
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-keyvault
spec:
  # Only namespaces explicitly labelled may pull secrets. Employee namespaces
  # (u-<id>) are never labelled: sandboxes and brains get no Key Vault access.
  conditions:
  - namespaceSelector:
      matchLabels:
        agentplatform.io/secrets-access: "true"
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-agentpoc-jt75.vault.azure.net/
      serviceAccountRef:
        name: external-secrets-kv-reader
        namespace: external-secrets
---
# Agent channel tokens (Telegram, ...) for employee namespaces only. Points at
# the separate agent-channels vault: no path to platform secrets. Secrets are
# named "<employee>-<agent>-<channel>"; ExternalSecrets come only from the
# GitOps agent chart (brains have no Kubernetes API token).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: agent-channels
spec:
  conditions:
  - namespaceSelector:
      matchExpressions:
      - {key: agentplatform.io/employee, operator: Exists}
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-agentch-jt75.vault.azure.net/
      serviceAccountRef:
        name: external-secrets-kv-reader
        namespace: external-secrets
