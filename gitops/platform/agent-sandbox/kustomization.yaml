apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Vendored from https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.10/sandbox-with-extensions.yaml
# (pinned + reviewable). Upgrade: replace the file and bump the comment.
resources:
- sandbox-with-extensions.yaml
patches:
- target: {kind: Deployment, name: agent-sandbox-controller}
  patch: |-
    - op: add
      path: /spec/template/spec/securityContext
      value:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    - op: add
      path: /spec/template/spec/containers/0/securityContext
      value:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        agentplatform.io/pool: platform
- target: {kind: Namespace, name: agent-sandbox-system}
  patch: |-
    - op: add
      path: /metadata/labels
      value:
        pod-security.kubernetes.io/enforce: restricted
