# Valkey ACL passwords live in Key Vault (never in git).
# Seed once: az keyvault secret set --vault-name kv-agentpoc-jt75 -n valkey-default-password --value "$(openssl rand -base64 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-users
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: valkey-users
  data:
  - secretKey: default
    remoteRef:
      key: valkey-default-password
