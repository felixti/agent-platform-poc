# Platform namespaces. Pod Security: enforce baseline, warn/audit restricted.
# Employee namespaces (u-<id>) enforce restricted (created by the agent chart).
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    agentplatform.io/secrets-access: "true"   # Valkey ACL passwords via ESO
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    agentplatform.io/secrets-access: "true"
