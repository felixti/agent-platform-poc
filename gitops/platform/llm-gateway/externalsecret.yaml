# Provider key from Key Vault -> Secret consumed only by Envoy's credential
# injection filter. Key "credential" holds the full header value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-credential
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: openrouter-credential
    template:
      engineVersion: v2
      data:
        credential: "Bearer {{ .key }}"
  data:
  - secretKey: key
    remoteRef:
      key: openrouter-api-key
