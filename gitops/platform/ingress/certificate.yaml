# Let's Encrypt via HTTP-01 through the public Gateway. One certificate, one
# SAN per UI host (sslip.io has no DNS-01 for wildcards). New agent = add its
# host here (and re-run tofu for the Entra redirect URI). Company: wildcard
# cert via DNS-01 instead.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: letsencrypt-account}
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - {name: public, namespace: ingress, kind: Gateway, sectionName: http}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-tls
  namespace: ingress
spec:
  secretName: public-tls
  issuerRef: {kind: ClusterIssuer, name: letsencrypt}
  dnsNames:
  - headlamp.20-121-208-105.sslip.io
  - alice-assistant.20-121-208-105.sslip.io
  - chat.20-121-208-105.sslip.io          # chat-harness-poc
