# Public HTTPS entry point (P3, D52/D53).
#   Internet -> Azure LB (static IP pip-aks-lab-ingress) -> Envoy "public"
#     :80  ACME HTTP-01 + redirect to https
#     :443 *.20-121-208-105.sslip.io  (Let's Encrypt cert, Entra ID OIDC on every route)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-lb
  namespace: ingress
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: public-gateway
        type: LoadBalancer
        externalTrafficPolicy: Local          # keeps client IPs; LB probes the node health port
        annotations:
          service.beta.kubernetes.io/azure-pip-name: pip-aks-lab-ingress
      envoyDeployment:
        replicas: 1
        pod:
          nodeSelector: {agentplatform.io/pool: platform}
        container:
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: ingress
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public-lb
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: {from: Same}            # ACME solver + redirect only
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.20-121-208-105.sslip.io"
    tls:
      mode: Terminate
      certificateRefs:
      - {kind: Secret, name: public-tls}
    allowedRoutes:
      # Routes come only from GitOps (brains/sandboxes have no API token).
      namespaces: {from: All}
---
# Everything on :80 that is not an ACME challenge goes to https.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: ingress
spec:
  parentRefs:
  - {name: public, sectionName: http}
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect: {scheme: https, statusCode: 301}
