apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # Gateway API CRDs are needed by cert-manager
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.10.0
    helm:
      valuesObject:
        config:
          envoyGateway:
            extensionApis:
              enableBackend: true   # FQDN backends + dynamic forward proxy (egress)
        deployment:
          envoyGateway:
            resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
          pod:
            nodeSelector: {agentplatform.io/pool: platform}
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 5m}}
