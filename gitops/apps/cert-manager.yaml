apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.5
    helm:
      valuesObject:
        crds: {enabled: true}
        global:
          nodeSelector: {agentplatform.io/pool: platform}
        resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 192Mi}}
        webhook:
          resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {memory: 96Mi}}
        cainjector:
          resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 192Mi}}
        # Let's Encrypt HTTP-01 is solved through Envoy Gateway (Gateway API).
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 5m}}
