# Headlamp (kubernetes-sigs, Apache-2.0): ops UI for the cluster — Sandboxes,
# pods, logs, events. PoC access: kubectl port-forward + short-lived token
# (`kubectl -n headlamp create token headlamp`). Entra ID OIDC later (P3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      valuesObject:
        nodeSelector: {agentplatform.io/pool: platform}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
        service: {type: ClusterIP, port: 80}
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
