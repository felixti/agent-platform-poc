# Chat harness PoC (separate repo): Pi-based internal chat under no-subprocess /
# read-only container rules. Its Azure resources live in that repo's infra/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-harness
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/felixti/chat-harness-poc.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: chat
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 5m}}
